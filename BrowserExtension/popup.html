<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 260px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; background: #0e1015; color: #e8eaf0; }
    .wrap { padding: 14px 16px; }
    h1 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 22px; height: 22px; }
    .state { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #8a92a6; }
    .ok .dot { background: #19f58c; box-shadow: 0 0 8px #19f58c; }
    .bad .dot { background: #f2666a; }
    p { margin: 6px 0; color: #8a92a6; }
    kbd { background: #1d212c; border: 1px solid #272c39; border-radius: 4px; padding: 0 4px; color: #e8eaf0; font: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><img src="icons/32.png" alt="">pxd Speak</h1>
    <div id="state" class="state"><span class="dot"></span><span id="text">Checking…</span></div>
    <p>Select text, then press <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>R</kbd> (or right-click › Read aloud with pxd Speak). Each word lights up as it's read.</p>
    <p>Click a word to jump there; <kbd>Esc</kbd> stops.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
